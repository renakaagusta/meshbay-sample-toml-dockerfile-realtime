# meshbay-sample-realtime: one service, two replicas, long-lived WebSocket and SSE connections.
# No database is required. Redis is optional: create a Redis database in the project and set REDIS_URL on the service
# to switch the fan-out between replicas on (see README, "Known Meshbay gaps").

[[services]]
name = "web"
ports = ["8080"]
replicas = 2

[services.build]
dockerfile = "Dockerfile"

[services.resources]
cpus = 0.5
memory = "512M"

[services.healthcheck]
# `bun` is on PATH in this image (`oven/bun`), `curl` is not installed, so the probe uses bun instead.
command = ["CMD-SHELL", "bun -e \"const response = await fetch('http://127.0.0.1:8080/health'); process.exit(response.ok ? 0 : 1)\""]
interval = "15s"
timeout = "5s"
start_period = "20s"
retries = 3

[services.env]
PORT = "8080"
